
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="google" value="notranslate">
    <style>
      /* Mirrors public/pm/app.css so the settings sheet reads as part of the
         same app instead of a leftover system dialog. */
      :root {
        color-scheme: light;
        --bg: #fcfcfb;
        --bg-panel: #fbfbf9;
        --bg-hover: #f3f2ef;
        --fg: #141413;
        --fg-dim: #3d3d3a;
        --fg-faint: #83827c;
        --border: #dedcd1;
        --border-soft: rgba(11, 11, 11, .08);
        --brand: #d97757;
        --brand-strong: #c6613f;
        --error: #c0392b;
        --radius: 8px;
        --sans: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #262624;
          --bg-panel: #30302e;
          --bg-hover: #383836;
          --fg: #faf9f5;
          --fg-dim: #c2c0b6;
          --fg-faint: #8a8983;
          --border: #1f1e1d;
          --border-soft: rgba(250, 249, 245, .08);
          --error: #ff6b6b;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: var(--sans);
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      /* Frameless window: the header doubles as the drag handle. */
      .titlebar {
        flex: 0 0 auto;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid var(--border-soft);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .01em;
        -webkit-app-region: drag;
        user-select: none;
      }
      ul {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        list-style: none;
        padding: 16px 20px;
        margin: 0;
      }
      li {
        margin: 0 0 12px;
        padding: 0;
      }
      ul li:last-child { margin-bottom: 0; }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label > span {
        flex: 0 0 104px;
        color: var(--fg-dim);
        font-weight: 500;
      }
      label i {
        font-style: normal;
        color: var(--fg-faint);
      }
      ul input, ul textarea, ul select {
        flex: 1 1 auto;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-panel);
        color: var(--fg);
        font-family: inherit;
        font-size: 13px;
        padding: 7px 10px;
        resize: none;
        outline: none;
        transition: border-color .12s ease, box-shadow .12s ease;
      }
      ul input:focus, ul textarea:focus, ul select:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(217, 119, 87, .16);
      }
      ul input::placeholder, ul textarea::placeholder { color: var(--fg-faint); }
      ul textarea {
        height: 132px;
        line-height: 1.5;
        font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .name, .pass { flex: 1 1 50%; }
      .proxy-port::after {
        content: '*';
        color: var(--error);
        margin-left: 3px;
      }
      .advanced-item { display: none; }
      .advanced-button { margin-top: -4px; }
      .advanced-button button {
        margin-left: 112px;
        border: none;
        padding: 0;
        background: none;
        color: var(--brand-strong);
        font-family: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }
      .advanced-button button:hover { text-decoration: underline; }
      /* Checkbox rows have no label column, so the control leads the line. */
      .form-item label > span { flex: 0 0 0; }
      .form-item em {
        font-style: normal;
        color: var(--fg-dim);
      }
      .form-item input[type="checkbox"] {
        flex: 0 0 auto;
        width: 15px;
        height: 15px;
        padding: 0;
        accent-color: var(--brand);
        margin: 0;
      }
      .form-item select {
        flex: 0 0 150px;
        padding: 5px 8px;
      }
      .footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border-soft);
        background: var(--bg-panel);
      }
      .btn {
        height: 30px;
        padding: 0 16px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        transition: background .12s ease, border-color .12s ease;
      }
      .btn[disabled] { opacity: .55; cursor: not-allowed; }
      .btn-default {
        color: var(--fg-dim);
        background: var(--bg);
        border-color: var(--border);
      }
      .btn-default:hover { background: var(--bg-hover); color: var(--fg); }
      .btn-primary {
        color: #fff;
        background: var(--brand);
      }
      .btn-primary:hover { background: var(--brand-strong); }
      #toast {
        position: fixed;
        left: 50%;
        top: 52px;
        transform: translateX(-50%);
        max-width: 340px;
        z-index: 100000001;
        display: none;
        text-align: center;
      }
      #toast #toastContent {
        display: inline-block;
        padding: 9px 14px;
        background: rgba(20, 20, 19, .92);
        color: #faf9f5;
        border-radius: var(--radius);
        box-shadow: 0 6px 18px rgba(11, 11, 11, .18);
        font-size: 12.5px;
        line-height: 1.4;
        text-align: left;
      }
      .vertial-align { white-space: nowrap; }
    </style>
  </head>
  <body style="overscroll-behavior-x: none;">
    <main>
      <div class="titlebar">Proxy Settings</div>
      <ul>
        <li>
          <label>
            <span class="proxy-port">Proxy Port:</span>
            <input id="port" type="number" class="port" maxlength="5" placeholder="8888" />
          </label>
        </li>
        <li class="advanced-item">
          <label>
            <span>Socks Port:</span>
            <input id="socksPort" type="number" class="port" maxlength="5" placeholder="Start a socksv5 proxy listening on given port" />
          </label>
        </li>
        <li class="advanced-item">
          <label>
            <span>Bound Host:</span>
            <input id="host" class="host" maxlength="255" placeholder="Bound given IP address or Domain for the proxy" />
          </label>
        </li>
        <li class="advanced-item">
          <label>
            <span>Proxy Auth:</span>
            <input id="username" class="name" maxlength="16" placeholder="Username" />
            <i>:</i>
            <input id="password" class="pass" maxlength="16" placeholder="Password" />
          </label>
        </li>
        <li class="advanced-button">
          <button id="showAdvanced">Show advanced options</button>
        </li>
        <li>
          <label>
            <span style="align-self: flex-start; padding-top: 7px;">Bypass List:</span>
            <textarea id="bypass" maxlength="2000" placeholder="Servers for which you do not want to use any proxy (separated by spaces)"></textarea>
          </label>
        </li>
        <li class="form-item">
          <label class="vertial-align">
            <span></span>
            <input id="useDefaultStorage" type="checkbox" />
            <em>Use whistle's default storage directory</em>
          </label>
        </li>
        <li class="form-item">
          <label class="vertial-align">
            <span></span>
            <input id="rejectUnauthorized" type="checkbox" />
            <em>Reject unauthorized HTTPS requests</em>
          </label>
        </li>
        <li class="form-item">
          <label class="vertial-align">
            <span></span>
            <em>--max-http-header-size=</em>
            <select id="maxHttpHeaderSize">
              <option value="256" selected>256k</option>
              <option value="512">512k</option>
              <option value="1024">1m</option>
              <option value="5120">5m</option>
              <option value="10240">10m</option>
              <option value="51200">50m</option>
              <option value="102400">100m</option>
            </select>
          </label>
        </li>
      </ul>
      <div class="footer">
        <button id="cancel" class="btn btn-default">Cancel</button>
        <button id="apply" class="btn btn-primary">Apply</button>
      </div>
    </main>
    <div id="toast">
      <div id="toastContent"></div>
    </div>
    <script>
      const { ipcRenderer } = require('electron');

      // Anthropic Sans ships inside Claude Desktop when the user has it; a
      // file:// page cannot link it directly, so register it from bytes.
      (function loadFont() {
        try {
          const fs = require('fs');
          const file = '/Applications/Claude.app/Contents/Resources/fonts/AnthropicSans-Romans-Variable-25x258.ttf';
          const buf = fs.readFileSync(file);
          const bytes = buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength);
          const face = new FontFace('Anthropic Sans', bytes);
          face.load().then(f => document.fonts.add(f), () => {});
        } catch (e) { /* falls back to the system face */ }
      })();
      const MAX_LEN = 16;
      function $(selector, all) {
        if (typeof selector !== 'string') {
          return selector;
        }
        return all ? document.querySelectorAll(selector) : document.querySelector(selector);
      }

      function forEach(selector, cb) {
        selector = $(selector, true);
        if (selector.length) {
          [].forEach.call($(selector, true), cb);
        } else {
          cb(selector, 0);
        }
      }

      function on(selector, type, l) {
        forEach(selector, function(elem) {
          if (Array.isArray(type)) {
            type.forEach(t => elem.addEventListener(t, l));
          } else {
            elem.addEventListener(type, l);
          }
        });
      }

      function show(selector) {
        forEach(selector, function(elem) {
          elem.style.display = 'block';
        });
      }

      function hide(selector) {
        forEach(selector, function(elem) {
          elem.style.display = 'none';
        });
      }

      const toast = $('#toast');
      let toastTimer;
      function showToast(msg) {
        clearTimeout(toastTimer);
        $('#toastContent').innerText = msg;
        show(toast);
        toastTimer = setTimeout(function() {
          hide(toast);
        }, 3000);
      }

      on('#toast', 'click', () => {
        clearTimeout(toastTimer);
        hide(toast);
      });

      function showAdvanced() {
        const btn = $('#showAdvanced');
        show('.advanced-item');
        hide(btn);
        $('#bypass').style.height = '93px';
        hide(btn.parentNode);
      }

      on('#showAdvanced', 'click', showAdvanced);

      function sendMsg(type, data) {
        ipcRenderer.send(type, data);
      }

      on('#cancel', 'click', function() {
        sendMsg('hideSettings');
      });

      const isPort = p => p > 0 && p < 65536;

      ipcRenderer.on('showToast', function(_, msg) {
        showToast(msg);
      });
      ipcRenderer.on('showSettings', (_, options) => {
        if (options) {
          $('#port').value = options.port;
          $('#socksPort').value = options.socksPort;
          $('#username').value = options.username;
          pwdInput.value = options.password;
          $('#host').value = options.host;
          $('#bypass').value = options.bypass;
          $('#useDefaultStorage').checked = options.useDefaultStorage;
          $('#rejectUnauthorized').checked = options.rejectUnauthorized;
          $('#maxHttpHeaderSize').value = options.maxHttpHeaderSize || 256;
          if (options.socksPort || options.host || options.username || options.password) {
            showAdvanced();
          }
          handlePwdInput(true);
        }
        foucsInput('#port');
      });
      const foucsInput = (selector) => {
        selector = $(selector);
        selector.select();
        selector.focus();
      };
      const pwdInput = $('#password');
      const handlePwdInput = function (init) {
        if (pwdInput.value.length > MAX_LEN) {
          if (init !== true) {
            pwdInput.value = '';
          }
          pwdInput.type = 'password';
        } else {
          pwdInput.type = 'text';
        }
      };

      on(pwdInput, ['focus', 'click'], function() {
        if (pwdInput.type !== 'password') {
          return;
        }
        foucsInput(pwdInput);
        setTimeout(function() {
          foucsInput(pwdInput);
        }, 0);
      });
      on(pwdInput, 'input', handlePwdInput);
      on('#apply', 'click', function() {
        const port = $('#port').value.trim();
        if (port && !isPort(port)) {
          foucsInput('#port');
          return showToast('Please input the correct port');
        }
        const socksPort = $('#socksPort').value.trim();
        if (socksPort && !isPort(socksPort)) {
          foucsInput('#socksPort');
          return showToast('Please input the correct socks port');
        }
        const host = $('#host').value.trim();
        if (/\s/.test(host)) {
          foucsInput('#host');
          return showToast('Bound host cannot have spaces');
        }
        const username = $('#username').value.trim();
        if (/\s/.test(username)) {
          foucsInput('#username');
          return showToast('Username cannot have spaces');
        }
        const password  = pwdInput.value.trim();
        if (/\s/.test(password)) {
          foucsInput('#password');
          return showToast('Password cannot have spaces');
        }

        sendMsg('applySettings', {
          port,
          socksPort,
          host,
          username,
          password,
          bypass: $('#bypass').value.trim(),
          useDefaultStorage: $('#useDefaultStorage').checked,
          rejectUnauthorized: $('#rejectUnauthorized').checked,
          maxHttpHeaderSize: $('#maxHttpHeaderSize').value,
        });
      });
    </script>
  </body>
</html>
